name: erpeace_app
description: "ERPeace - Mobile ERP untuk UMKM Indonesia (Inventori, Pembelian, Penjualan)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.18.3

  # State management
  flutter_riverpod: ^3.3.2

  # Routing
  go_router: ^17.5.0

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # UI
  google_fonts: ^8.2.1
  fl_chart: ^1.3.0
  shimmer: ^3.0.0
  intl: ^0.20.2

  # Config
  flutter_dotenv: ^6.0.1

  # Local persistence (theme preference)
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.13.1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - .env
